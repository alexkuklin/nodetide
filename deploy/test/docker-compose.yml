# Nodetide test stack: node + OIDC bridge + email verifier + a standard OIDC client + a test wallet.
#
#   ./init.sh --domain example.org     # writes .env and config/ (once)
#   docker compose up -d --build       # add --profile edge if nothing else serves ports 80/443
#
# Everything binds to 127.0.0.1; put a reverse proxy in front (see nginx.conf.example) or use the
# bundled Caddy edge. Service names reach each other, and the public host names reach the proxy
# through host-gateway, so the browser and the containers use the very same URLs.
name: nodetide-test

x-hosts: &hosts
  extra_hosts:
    - "${NODE_HOST}:host-gateway"
    - "${RP_HOST}:host-gateway"
    - "${WALLET_HOST}:host-gateway"
    - "${GRAFANA_HOST}:host-gateway"
    - "${VERIFIER_HOST}:host-gateway"

x-image: &image
  image: nodetide-test:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: deploy/test/Dockerfile
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}

services:
  node:
    <<: [*hosts, *image]
    restart: unless-stopped
    environment:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      # sign-in with any Nodetide identity through standard OIDC
      NODETIDE_OIDC_ISSUER: ${NODE_URL}
      NODETIDE_AUTH_AUDIENCE: ${NODE_URL}
      NODETIDE_OIDC_CLIENTS_FILE: /config/clients.json
      NODETIDE_OIDC_KEY_FILE: /data/oidc_signing_key.pem
      NODETIDE_OIDC_ALLOW_INSECURE: ${ALLOW_INSECURE:-0}
      # the sign-in page offers "open in wallet" for the stack's wallet and for one on the user's own machine
      NODETIDE_OIDC_WALLET_URLS: ${WALLET_URL},http://localhost:${LOCAL_WALLET_PORT:-4572}
      # This node verifies nobody. It believes email attestations only from the verification service named in
      # /issuer/email-issuer (written by the verifier container; the entrypoint passes it on as NODETIDE_OIDC_EMAIL_ISSUERS).
      # qualified-signature proofs, judged against ./anchors
      NODETIDE_EIDAS_REVOCATION: ${EIDAS_REVOCATION:-hard-fail}
    volumes:
      - node-data:/data
      - issuer-share:/issuer:ro
      - ./config:/config:ro
      - ${ANCHORS_DIR:-./anchors}:/anchors:ro
    ports:
      - "127.0.0.1:${NODE_PORT:-4570}:4557"
    depends_on:
      verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4557/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # An independent party: own process, own storage, own issuer identity. It shares nothing with the node except the
  # (public) hash of its issuer identity, which the operator pins in the node.
  verifier:
    <<: [*hosts, *image]
    restart: unless-stopped
    command: ["python", "-m", "nodetide.verifiers.service", "--host", "0.0.0.0", "--port", "4558"]
    environment:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      NODETIDE_VERIFIER_URL: ${VERIFIER_URL}
      NODETIDE_VERIFIER_HOME: /data
      NODETIDE_VERIFIER_PUBLISH_ISSUER: /share/email-issuer
      NODETIDE_ISSUER_NAME: Nodetide test email verifier
      # mail goes to the catch-all mailbox below unless SMTP_HOST is set in .env (then to the real recipient)
      NODETIDE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      NODETIDE_SMTP_PORT: ${SMTP_PORT:-1025}
      NODETIDE_SMTP_SECURITY: ${SMTP_SECURITY:-none}
      NODETIDE_SMTP_USER: ${SMTP_USER:-}
      NODETIDE_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NODETIDE_EMAIL_FROM: ${EMAIL_FROM:-verify@${VERIFIER_HOST}}
    volumes:
      - verifier-data:/data
      - issuer-share:/share
    ports:
      - "127.0.0.1:${VERIFIER_PORT:-4575}:4558"
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4558/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAIL_PORT:-4573}:8025"   # catch-all mailbox UI (only holds the verifier's mail); keep it private

  wallet:
    <<: [*hosts, *image]
    restart: unless-stopped
    command: ["python", "/opt/wallet/app.py"]
    environment:
      NODE_URL: ${NODE_URL}
      WALLET_URL: ${WALLET_URL}
      VERIFIER_URL: ${VERIFIER_URL}
      WALLET_PASSWORD: ${WALLET_PASSWORD}
      DATA_DIR: /data
      PORT: "4572"
    volumes:
      - wallet-data:/data
    ports:
      - "127.0.0.1:${WALLET_PORT:-4572}:4572"
    depends_on:
      node:
        condition: service_healthy

  # An ordinary application with native OIDC support (not part of Nodetide): the guinea pig for sign-in.
  grafana:
    <<: *hosts
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_URL}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Nodetide
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${NODE_URL}/oidc/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${NODE_URL}/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${NODE_URL}/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # sub is the identity hash; Grafana insists on a login and an email, and an email is only
      # present when the user shared a verified one
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: sub
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name || sub
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email || join('', [sub, '@nodetide.invalid'])"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: ${SKIP_TLS_VERIFY:-false}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-4574}:3000"
    depends_on:
      node:
        condition: service_healthy
      verifier:
        condition: service_healthy

  echo:
    <<: *image
    restart: unless-stopped
    command: ["python", "/opt/echo/app.py"]
    environment:
      PORT: "8080"

  rp:
    <<: *hosts
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${NODE_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${RP_URL}/oauth2/callback
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: sub        # the identity hash; an email may not have been verified
      OAUTH2_PROXY_USER_ID_CLAIM: sub
      OAUTH2_PROXY_UPSTREAMS: http://echo:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"   # the echo page reads the id_token from it
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: ${SKIP_TLS_VERIFY:-false}
    ports:
      - "127.0.0.1:${RP_PORT:-4571}:4180"
    depends_on:
      echo:
        condition: service_started
      node:
        condition: service_healthy
      edge:
        condition: service_started
        required: false   # only present with the edge profile

  # Optional: terminates TLS (Let's Encrypt) for the three host names. Needs ports 80/443 free.
  edge:
    image: caddy:2
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      NODE_SITE: ${NODE_SITE}
      RP_SITE: ${RP_SITE}
      WALLET_SITE: ${WALLET_SITE}
      GRAFANA_SITE: ${GRAFANA_SITE}
      VERIFIER_SITE: ${VERIFIER_SITE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${EDGE_HTTP_PORT:-80}:${EDGE_HTTP_PORT:-80}"
      - "${EDGE_HTTPS_PORT:-443}:${EDGE_HTTPS_PORT:-443}"
    depends_on:
      node:
        condition: service_healthy

volumes:
  node-data:
  verifier-data:
  issuer-share:
  wallet-data:
  grafana-data:
  caddy-data:
