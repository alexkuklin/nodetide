name: Build SMS gateway image

on:
  push:
    branches:
      - main
    paths:
      - 'tools/sms-gateway/**'
      - '.github/workflows/sms-gateway-image.yml'
  pull_request:
    paths:
      - 'tools/sms-gateway/**'
      - '.github/workflows/sms-gateway-image.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nodetide/poc/python/sms-gateway

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/nodetide-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr,prefix=pr-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: tools/sms-gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sms-gateway
          cache-to: type=gha,mode=max,scope=sms-gateway
          platforms: linux/amd64,linux/arm64
